<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiritual Citations App</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#764ba2">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Citations">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --primary: #764ba2;
            --secondary: #667eea;
            --accent: #ff9a9e;
            --bg-glass: rgba(255, 255, 255, 0.9);
            --text-main: #2d3436;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 40px 20px;
            color: var(--text-main);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-glass);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5em;
            font-weight: 800;
            background: linear-gradient(to right, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .info {
            background: #edf2ff;
            color: #4c6ef5;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9em;
            line-height: 1.5;
        }

        .options-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .option-group.full-width {
            grid-column: span 2;
        }

        .option-group label {
            display: block;
            margin-bottom: 12px;
            color: #555;
            font-weight: 600;
            font-size: 0.95em;
        }

        input[type="text"],
        input[type="number"] {
            padding: 15px 25px;
            border: 2px solid #eee;
            border-radius: 15px;
            width: 100%;
            font-size: 1em;
            transition: all 0.3s;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #f0f4f8;
            padding: 15px 25px;
            border-radius: 15px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .checkbox-container:hover {
            background: #e2e8f0;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 60px;
            border-radius: 50px;
            font-size: 1.25em;
            font-weight: 700;
            cursor: pointer;
            display: block;
            margin: 30px auto;
            box-shadow: 0 10px 25px rgba(118, 75, 162, 0.3);
            transition: all 0.3s;
            width: 100%;
        }

        button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(118, 75, 162, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .citations-container {
            margin-top: 40px;
        }

        .citation {
            background: white;
            border-left: 8px solid var(--primary);
            padding: 30px;
            margin-bottom: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .citation-text {
            font-size: 1.25em;
            line-height: 1.7;
            color: #2d3436;
            margin-bottom: 15px;
            font-style: italic;
        }

        .citation-context {
            font-size: 0.85em;
            color: #888;
            border-top: 1px solid #f0f0f0;
            padding-top: 15px;
        }

        .loading {
            text-align: center;
            color: var(--primary);
            padding: 20px;
            font-weight: bold;
        }

        .error {
            background: #fff5f5;
            color: #d63031;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            text-align: center;
        }

        .success-info {
            background: #edf2ff;
            color: #4c6ef5;
            padding: 15px;
            border-radius: 15px;
            margin: 20px 0;
            text-align: center;
        }

        .ai-badge {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7em;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
                border-radius: 0;
            }

            .options-section {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>✨ Bibliothèque de Paradoxes</h1>

        <div class="info">
            Recherche transversale dans la bibliothèque numérique GitHub.<br>
            Sélectionne les meilleurs extraits via Intelligence Artificielle.
        </div>

        <div class="options-section">
            <div class="option-group full-width">
                <label for="keywordInput">Thème ou mot-clé (ex: Silence, Mort, Lumière...) :</label>
                <input type="text" id="keywordInput" placeholder="Obligatoire pour cibler les livres">
            </div>

            <div class="option-group">
                <label for="numCitations">Nombre :</label>
                <input type="number" id="numCitations" value="5" min="1" max="10">
            </div>

            <div class="option-group">
                <label>&nbsp;</label>
                <label for="useAI" class="checkbox-container">
                    <input type="checkbox" id="useAI" checked>
                    <span>Mode IA ✨</span>
                </label>
            </div>
        </div>

        <button id="extractBtn">Lancer la Recherche Online</button>

        <div id="messageContainer"></div>
        <div id="citationsContainer" class="citations-container"></div>
    </div>

    <script>
        const GITHUB_BASE_URL = 'https://raw.githubusercontent.com/dictionnaireS/livres/main';
        const CATALOG_FILENAME = 'LIVRES/index_master.json';
        const PROXY_URL = "https://gildasr-dictionnaires.hf.space/api/chat";

        const OPENROUTER_MODELS = [
            "meta-llama/llama-3.3-70b-instruct:free",
            "meta-llama/llama-3.1-405b-instruct:free",
            "mistralai/mistral-small-3.1-24b-instruct:free",
            "google/gemini-2.0-pro-exp-02-05:free"
        ];

        const extractBtn = document.getElementById('extractBtn');
        const keywordInput = document.getElementById('keywordInput');
        const numCitationsInput = document.getElementById('numCitations');
        const useAICheckbox = document.getElementById('useAI');
        const citationsContainer = document.getElementById('citationsContainer');
        const messageContainer = document.getElementById('messageContainer');

        const vocabulaireReligieux = ['dieu', 'seigneur', 'christ', 'esprit', 'saint', 'âme', 'foi', 'prière', 'silence', 'mort', 'vie', 'lumière', 'ténèbres', 'grâce', 'mystique', 'paradis', 'éternel'];

        extractBtn.addEventListener('click', async () => {
            const keyword = keywordInput.value.trim();
            if (!keyword) {
                showMessage("Veuillez saisir un mot-clé pour explorer la bibliothèque.", "error");
                return;
            }

            citationsContainer.innerHTML = '';
            messageContainer.innerHTML = '';
            extractBtn.disabled = true;

            const numCitations = parseInt(numCitationsInput.value) || 5;
            const useAI = useAICheckbox.checked;

            try {
                showMessage('🔍 Chargement du catalogue...', 'loading');
                const indexResponse = await fetch(`${GITHUB_BASE_URL}/${CATALOG_FILENAME}`);
                if (!indexResponse.ok) throw new Error("Impossible d'accéder à la bibliothèque.");
                const libraryIndex = await indexResponse.json();

                const topBooks = findBestBooks(libraryIndex, keyword, 10);
                if (topBooks.length === 0) throw new Error("Aucun livre ne correspond à ce thème.");

                const selectedBooks = selectRandomBooks(topBooks, 3);
                showMessage(`📚 Exploration de : ${selectedBooks.map(b => b.titre).join(', ')}`, 'success-info');

                let candidates = [];
                for (const book of selectedBooks) {
                    const bookResponse = await fetch(`${GITHUB_BASE_URL}/${book.fichier_source}`);
                    if (!bookResponse.ok) continue;

                    const bookData = await bookResponse.json();
                    let bookText = bookData.texte_integral || (Array.isArray(bookData.contenu) ? bookData.contenu.join(' ') : bookData.contenu) || "";

                    if (bookText) {
                        const bookCandidates = extractCitations(bookText, keyword, numCitations * 3);
                        bookCandidates.forEach(c => c.source = `${book.titre} (${book.auteur})`);
                        candidates = candidates.concat(bookCandidates);
                    }
                }

                if (candidates.length === 0) throw new Error("Pas de citations paradoxales trouvées.");

                candidates.sort(() => Math.random() - 0.5);
                let finalCitations = useAI
                    ? await runAIAnalysis(candidates.slice(0, 40), keyword, numCitations)
                    : candidates.sort((a, b) => b.score - a.score).slice(0, numCitations);

                displayCitations(finalCitations, useAI);

            } catch (error) {
                showMessage(error.message, 'error');
            } finally {
                extractBtn.disabled = false;
            }
        });

        function findBestBooks(indexData, keyword, limit) {
            const books = Array.isArray(indexData) ? indexData : (indexData.livres || []);
            const search = keyword.toLowerCase();
            return books.map(book => {
                let s = 0;
                if (book.titre?.toLowerCase().includes(search)) s += 20;
                if (book.auteur?.toLowerCase().includes(search)) s += 10;
                if (book.themes?.some(t => t.toLowerCase().includes(search))) s += 15;
                if (book.mots_cles?.some(mc => mc.toLowerCase().includes(search))) s += 25;
                let filePath = book.fichier || book.fichier_source;
                if (filePath && !filePath.includes('/')) filePath = 'LIVRES/' + filePath;
                return { ...book, relevance: s, fichier_source: filePath };
            }).filter(b => b.relevance > 0).sort((a, b) => b.relevance - a.relevance).slice(0, limit);
        }

        function selectRandomBooks(books, count) {
            return [...books].sort(() => 0.5 - Math.random()).slice(0, count);
        }

        function extractCitations(text, keyword, limit) {
            const phrases = text.match(/[^.!?]+[.!?]+/g) || [];
            return phrases
                .map(p => p.trim())
                .filter(p => p.length > 50 && p.length < 500)
                .filter(p => vocabulaireReligieux.some(v => p.toLowerCase().includes(v)))
                .map(p => ({ phrase: p, score: calculateParadoxScore(p, keyword) }))
                .sort((a, b) => b.score - a.score)
                .slice(0, limit);
        }

        function calculateParadoxScore(phrase, kw) {
            let s = 0;
            if (phrase.toLowerCase().includes(kw.toLowerCase())) s += 15;
            const pairs = [['lumière', 'ténèbres'], ['vie', 'mort'], ['tout', 'rien'], ['plein', 'vide'], ['grand', 'petit'], ['maître', 'serviteur']];
            pairs.forEach(p => { if (phrase.toLowerCase().includes(p[0]) && phrase.toLowerCase().includes(p[1])) s += 10; });
            return s;
        }

        async function runAIAnalysis(candidates, keyword, num) {
            const textContent = candidates.map(c => c.phrase).join('\n---\n');
            const prompt = `Tu es un expert en paradoxes mystiques. RECOPIE MOT POUR MOT (sans changer une virgule) ${num} citations de la liste suivante qui présentent des paradoxes spirituels forts liés à "${keyword}".
            IMPORTANT: Pas de blabla, juste les phrases exactes.
            
            TEXTE:
            ${textContent}`;

            for (let model of OPENROUTER_MODELS) {
                try {
                    const response = await fetch(PROXY_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ model, messages: [{ role: "user", content: prompt }], temperature: 0.3 })
                    });
                    const data = await response.json();
                    const content = data.choices?.[0]?.message?.content || data.response;
                    if (content) {
                        return content.split('\n').filter(l => l.length > 20).slice(0, num).map(p => {
                            const clean = s => s.toLowerCase().replace(/[^\w\s]/g, '').replace(/\s+/g, '');
                            const match = candidates.find(c => clean(p).includes(clean(c.phrase).substring(0, 40)));
                            return { phrase: p, source: match?.source || "Inconnu", aiGenerated: true };
                        });
                    }
                } catch (e) { }
            }
            return candidates.slice(0, num);
        }

        function displayCitations(citations, useAI) {
            citationsContainer.innerHTML = citations.map((c, i) => `
                <div class="citation">
                    <div class="citation-text">"${c.phrase}"</div>
                    <div class="citation-context">
                        <strong>${c.source}</strong> | Citation ${i + 1}/${citations.length} ${c.aiGenerated ? '<span class="ai-badge">IA</span>' : ''}
                    </div>
                </div>
            `).join('');
        }

        function showMessage(text, type) {
            messageContainer.innerHTML = `<div class="${type}">${text}</div>`;
        }
    </script>
</body>

</html>
